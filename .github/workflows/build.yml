name: CI/CD — VN Stock Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ══════════════════════════════════════════════════════
  # JOB 1: Test Python service
  # ══════════════════════════════════════════════════════
  test-python:
    name: Python Service — Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        working-directory: python-service
        run: pip install -r requirements.txt

      - name: Check syntax (import test)
        working-directory: python-service
        run: python -c "import main; print('Python service OK')"

      - name: Start service & health check
        working-directory: python-service
        run: |
          # Start FastAPI in background
          uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for FastAPI to start..."

          # Wait up to 30 seconds
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8000/health > /dev/null; then
              echo "✅ Health check passed!"
              kill $SERVER_PID
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 1
          done

          echo "❌ Server failed to start."
          echo "========== UVICORN LOG =========="
          cat uvicorn.log

          kill $SERVER_PID || true
          exit 1

  # ══════════════════════════════════════════════════════
  # JOB 2: Build Spring Boot
  # ══════════════════════════════════════════════════════
  build-spring:
    name: Spring Boot — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: spring-service
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Run tests
        working-directory: spring-service
        run: mvn test --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-platform-jar
          path: spring-service/target/*.jar
          retention-days: 7

  # ══════════════════════════════════════════════════════
  # JOB 3: Code quality summary
  # (chạy sau khi cả 2 job trên pass)
  # ══════════════════════════════════════════════════════
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ test-python, build-spring ]

    steps:
      - name: All checks passed
        run: |
          echo "✅ Python service: OK"
          echo "✅ Spring Boot build: OK"
          echo "✅ Ready to deploy"
