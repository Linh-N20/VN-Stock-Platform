<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Profile', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">

<div class="row justify-content-center">
<div class="col-md-8 col-lg-6">

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">

            <!-- Avatar + tên -->
            <div class="text-center mb-4">
                <div class="position-relative d-inline-block">
                    <img th:if="${picture != null and !#strings.isEmpty(picture)}"
                         th:src="${picture}"
                         class="rounded-circle border border-3 border-primary"
                         width="90" height="90"
                         style="object-fit:cover"
                         alt="Avatar">
                    <div th:unless="${picture != null and !#strings.isEmpty(picture)}"
                         class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center"
                         style="width:90px;height:90px;font-size:2rem;color:white">
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>

                <h4 class="fw-bold mt-3 mb-1" th:text="${fullName ?: 'Người dùng'}"></h4>
                <p class="text-muted mb-2" th:text="${email ?: ''}"></p>

                <span th:if="${user != null}" class="badge"
                      th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                      th:text="${user.role.name() == 'ADMIN'} ? 'Admin' : 'Thành viên'">
                </span>
                <span th:unless="${user != null}" class="badge bg-primary">Thành viên</span>
            </div>

            <hr class="opacity-25">

            <!-- Thông tin chi tiết -->
            <div class="row g-3" th:if="${user != null}">
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-calendar-plus me-1"></i>Ngày tham gia
                        </small>
                        <span class="fw-semibold"
                              th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">
                        </span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-clock me-1"></i>Đăng nhập lần cuối
                        </small>
                        <span class="fw-semibold"
                              th:text="${user.lastLoginAt != null}
                                ? ${#temporals.format(user.lastLoginAt, 'HH:mm dd/MM/yyyy')}
                                : 'Lần đầu'">
                        </span>
                    </div>
                </div>
            </div>

            <div class="row g-3 mt-0">
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-shield-lock me-1"></i>Đăng nhập qua
                        </small>
                        <span class="fw-semibold text-primary">
                            <i class="bi bi-google me-1"></i>Google OAuth2
                        </span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-shield-check me-1"></i>Bảo mật
                        </small>
                        <span class="fw-semibold text-success">
                            <i class="bi bi-check-circle me-1"></i>Được bảo vệ
                        </span>
                    </div>
                </div>
            </div>

            <hr class="opacity-25">

            <div class="alert alert-info border-0 rounded-3 small mb-4">
                <i class="bi bi-info-circle me-2"></i>
                Tài khoản được bảo vệ bởi Google. Chúng tôi không lưu mật khẩu của bạn.
            </div>

            <!-- Actions -->
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i>Trang chủ
                </a>
                <a th:href="@{/market}" class="btn btn-outline-primary">
                    <i class="bi bi-table me-1"></i>Thị trường
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
</div>

</th:block>
</body>
</html>
