<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Profile', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">

<div class="row justify-content-center">
<div class="col-md-10 col-lg-8">

    <!-- Profile card -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img th:if="${picture != null and !#strings.isEmpty(picture)}"
                     th:src="${picture}"
                     class="rounded-circle border border-3 border-primary"
                     width="90" height="90" style="object-fit:cover" alt="Avatar">
                <div th:unless="${picture != null and !#strings.isEmpty(picture)}"
                     class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center"
                     style="width:90px;height:90px;font-size:2rem;color:white">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h4 class="fw-bold mt-3 mb-1" th:text="${fullName ?: 'Người dùng'}"></h4>
                <p class="text-muted mb-2" th:text="${email ?: ''}"></p>
                <span th:if="${user != null}" class="badge"
                      th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                      th:text="${user.role.name() == 'ADMIN'} ? 'Admin' : 'Thành viên'">
                </span>
            </div>

            <hr class="opacity-25">

            <div class="row g-3" th:if="${user != null}">
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-calendar-plus me-1"></i>Ngày tham gia
                        </small>
                        <span class="fw-semibold"
                              th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-clock me-1"></i>Đăng nhập lần cuối
                        </small>
                        <span class="fw-semibold"
                              th:text="${user.lastLoginAt != null}
                                ? ${#temporals.format(user.lastLoginAt, 'HH:mm dd/MM/yyyy')}
                                : 'Lần đầu'"></span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-shield-lock me-1"></i>Đăng nhập qua
                        </small>
                        <span class="fw-semibold text-primary">
                            <i class="bi bi-google me-1"></i>Google OAuth2
                        </span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3">
                        <small class="text-muted d-block mb-1">
                            <i class="bi bi-shield-check me-1"></i>Bảo mật
                        </small>
                        <span class="fw-semibold text-success">
                            <i class="bi bi-check-circle me-1"></i>Được bảo vệ
                        </span>
                    </div>
                </div>
            </div>

            <hr class="opacity-25">

            <div class="alert alert-info border-0 rounded-3 small mb-4">
                <i class="bi bi-info-circle me-2"></i>
                Tài khoản được bảo vệ bởi Google. Chúng tôi không lưu mật khẩu của bạn.
            </div>

            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i>Trang chủ
                </a>
                <a th:href="@{/market}" class="btn btn-outline-primary">
                    <i class="bi bi-table me-1"></i>Thị trường
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Danh sách yêu thích -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold d-flex align-items-center gap-2">
            <i class="bi bi-heart-fill text-danger"></i>
            Danh sách yêu thích
            <span class="badge bg-danger ms-1" id="fav-count">0</span>
        </div>
        <div class="card-body" id="fav-body">
            <div class="text-center text-muted py-3" id="fav-empty">
                <i class="bi bi-heart d-block fs-2 mb-2 opacity-50"></i>
                <p class="small mb-0">Chưa có cổ phiếu yêu thích.<br>
                Nhấn vào biểu tượng ❤ trên trang chi tiết để thêm.</p>
            </div>
            <div class="row g-2" id="fav-list"></div>
        </div>
    </div>

</div>
</div>

<script>
const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';

function showToast(msg) {
    let t = document.getElementById('prof-toast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'prof-toast';
        t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;' +
            'background:#1e293b;color:#f1f5f9;padding:10px 18px;border-radius:10px;' +
            'font-size:.875rem;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:opacity .3s;opacity:0';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(() => t.style.opacity = '0', 2500);
}

function renderFavCard(sym) {
    return `
    <div class="col-6 col-md-4 col-lg-3" id="fav-card-${sym}">
        <div class="card border-0 bg-light h-100">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <a href="/stocks/${sym}" class="fw-bold text-decoration-none text-primary">${sym}</a>
                <button class="btn btn-link p-0 text-danger border-0"
                        title="Bỏ yêu thích"
                        onclick="toggleFavProfile('${sym}', this)">
                    <i class="bi bi-heart-fill"></i>
                </button>
            </div>
        </div>
    </div>`;
}

function updateCount(delta) {
    const el  = document.getElementById('fav-count');
    const n   = Math.max(0, parseInt(el.textContent || '0') + delta);
    el.textContent = n;
    document.getElementById('fav-empty').style.display = n === 0 ? 'block' : 'none';
}

function toggleFavProfile(symbol, btn) {
    fetch(`/api/favorites/toggle/${symbol}`, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'X-CSRF-TOKEN': CSRF_TOKEN }
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { showToast('Lỗi: ' + data.error); return; }
        if (!data.favorited) {
            // Xóa card
            const card = document.getElementById(`fav-card-${symbol}`);
            if (card) card.remove();
            updateCount(-1);
            showToast(`🤍 Đã xóa ${symbol} khỏi yêu thích`);
        } else {
            showToast(`❤️ Đã thêm ${symbol} vào yêu thích`);
        }
    })
    .catch(() => showToast('Có lỗi xảy ra'));
}

// Load danh sách yêu thích
fetch('/api/favorites', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
        const symbols = data.favorites || [];
        const countEl = document.getElementById('fav-count');
        const emptyEl = document.getElementById('fav-empty');
        const listEl  = document.getElementById('fav-list');

        countEl.textContent = symbols.length;
        emptyEl.style.display = symbols.length === 0 ? 'block' : 'none';

        if (symbols.length > 0) {
            listEl.innerHTML = symbols.map(sym => renderFavCard(sym)).join('');
        }
    })
    .catch(() => {});
</script>

</th:block>
</body>
</html>
