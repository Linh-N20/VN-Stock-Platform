<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Tìm kiếm', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">

<div class="mb-4">
    <h1 class="h3 fw-bold mb-1">Kết quả tìm kiếm</h1>
    <p class="text-muted" th:text="'Từ khoá: ' + ${query}"></p>
</div>

<!-- Lỗi -->
<div th:if="${error}" class="alert alert-warning border-0 rounded-3">
    <i class="bi bi-exclamation-triangle me-2"></i>
    <span th:text="${error}"></span>
</div>

<!-- Không có kết quả -->
<div th:if="${results != null and results.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-search display-4 d-block mb-3 opacity-50"></i>
    <p>Không tìm thấy cổ phiếu nào với từ khoá "<span th:text="${query}"></span>"</p>
    <a th:href="@{/}" class="btn btn-outline-primary mt-2">
        <i class="bi bi-house me-1"></i>Về trang chủ
    </a>
</div>

<!-- Danh sách kết quả -->
<div th:if="${results != null and !results.empty}" class="row g-3">
    <div th:each="stock : ${results}" class="col-md-6 col-lg-4">
        <a th:href="@{/stocks/{s}(s=${stock['symbol']})}"
           class="card border-0 shadow-sm text-decoration-none hover-card h-100">
            <div class="card-body d-flex align-items-center gap-3 p-3">
                <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center
                            justify-content-center flex-shrink-0"
                     style="width:48px;height:48px">
                    <span class="fw-bold text-primary small" th:text="${stock['symbol']}"></span>
                </div>
                <div>
                    <div class="fw-bold" th:text="${stock['symbol']}"></div>
                    <div class="small text-muted" th:text="${stock['name']}"></div>
                    <span class="badge bg-light text-dark border small mt-1"
                          th:text="${stock['exchange']}"></span>
                    <span class="badge bg-light text-dark border small mt-1 ms-1"
                          th:text="${stock['sector']}"></span>
                </div>
                <i class="bi bi-arrow-right ms-auto text-muted"></i>
            </div>
        </a>
    </div>
</div>

<!-- Search lại -->
<div class="mt-4">
    <form th:action="@{/search}" method="get" class="d-flex gap-2" style="max-width:400px">
        <input type="text" name="q" class="form-control"
               placeholder="Tìm mã cổ phiếu hoặc tên công ty..."
               th:value="${query}" autofocus>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-search"></i>
        </button>
    </form>
</div>

</th:block>
</body>
</html>
