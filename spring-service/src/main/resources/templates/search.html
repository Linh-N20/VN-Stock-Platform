<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Tìm kiếm', ~{::main-content})}">
<body>
<th:block th:fragment="main-content">

<div class="mb-4">
    <h1 class="h3 fw-bold mb-0">Kết quả tìm kiếm</h1>
    <small class="text-muted">Từ khoá: "<span th:text="${query}"></span>"</small>
</div>

<div th:if="${results.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-search display-4 d-block mb-3 opacity-50"></i>
    <p>Không tìm thấy cổ phiếu nào khớp với "<strong th:text="${query}"></strong>"</p>
    <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Về Dashboard</a>
</div>

<div class="row g-3" th:unless="${results.empty}">
    <div class="col-md-4 col-lg-3" th:each="stock : ${results}">
        <a th:href="@{/stocks/{s}(s=${stock.symbol})}" class="text-decoration-none">
            <div class="card border-0 shadow-sm h-100 hover-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="fw-bold text-primary mb-1" th:text="${stock.symbol}"></h5>
                            <p class="text-muted small mb-2" th:text="${stock.name}"></p>
                        </div>
                        <span class="badge bg-light text-dark border"
                              th:text="${stock.exchange}"></span>
                    </div>
                    <div class="text-end mt-2">
                        <small class="text-muted">Xem phân tích <i class="bi bi-arrow-right"></i></small>
                    </div>
                </div>
            </div>
        </a>
    </div>
</div>

</th:block>
</body>
</html>
