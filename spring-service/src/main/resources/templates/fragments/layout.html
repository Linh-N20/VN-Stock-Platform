<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — VN Stock Platform'">VN Stock Platform</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-graph-up-arrow me-2 text-success"></i>VN Stock Platform
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <!-- Search bar -->
            <form class="d-flex me-auto ms-3" th:action="@{/search}" method="get">
                <div class="input-group" style="width:240px">
                    <input type="text" name="q" class="form-control form-control-sm bg-secondary border-0 text-white"
                           placeholder="Tìm cổ phiếu... (VNM, FPT)" autocomplete="off">
                    <button class="btn btn-success btn-sm" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/learn}">
                        <i class="bi bi-book me-1"></i>Học chứng khoán
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 rounded-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 rounded-3">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<main class="container pb-5">
    <th:block th:replace="${content}"/>
</main>

<!-- Disclaimer cố định ở cuối -->
<footer class="bg-dark text-center py-3 mt-4">
    <small class="text-warning">
        <i class="bi bi-exclamation-triangle me-1"></i>
        Thông tin trên website mang tính tham khảo kỹ thuật, KHÔNG phải lời khuyên đầu tư.
        Mọi quyết định đầu tư đều có rủi ro.
    </small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
