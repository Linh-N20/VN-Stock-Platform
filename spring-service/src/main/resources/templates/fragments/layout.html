<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — VN Stock Platform'">VN Stock Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSRF token cho JavaScript fetch calls -->
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        /* Autocomplete dropdown */
        .search-wrapper { position: relative; }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 9999;
            max-height: 320px;
            overflow-y: auto;
            display: none;
        }
        .autocomplete-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: inherit;
            transition: background 0.1s;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover,
        .autocomplete-item.active { background: #f0f4ff; }
        .autocomplete-symbol {
            font-weight: 700;
            font-size: 0.85rem;
            color: #4f46e5;
            min-width: 50px;
        }
        .autocomplete-name {
            font-size: 0.78rem;
            color: #6c757d;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .autocomplete-badge {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #6c757d;
            margin-left: auto;
            flex-shrink: 0;
        }
        .autocomplete-empty {
            padding: 10px 12px;
            color: #6c757d;
            font-size: 0.82rem;
            text-align: center;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-graph-up-arrow me-2 text-success"></i>VN Stock Platform
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">

            <!-- Search với autocomplete -->
            <form class="d-flex me-auto ms-3" th:action="@{/search}" method="get"
                  id="searchForm" autocomplete="off">
                <div class="search-wrapper" style="width:260px">
                    <div class="input-group">
                        <input type="text" name="q" id="searchInput"
                               class="form-control form-control-sm bg-secondary border-0 text-white"
                               placeholder="Tìm cổ phiếu... (VNM, FPT)"
                               autocomplete="off">
                        <button class="btn btn-success btn-sm" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                    <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
                </div>
            </form>

            <ul class="navbar-nav align-items-center gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/market}">
                        <i class="bi bi-table me-1"></i>Thị trường
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/learn}">
                        <i class="bi bi-book me-1"></i>Học
                    </a>
                </li>

                <!-- Chưa đăng nhập -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm ms-2" th:href="@{/login}">
                        <i class="bi bi-google me-1"></i>Đăng nhập
                    </a>
                </li>

                <!-- Đã đăng nhập -->
                <li class="nav-item dropdown ms-2" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2 p-0 ps-1"
                       href="#" data-bs-toggle="dropdown" aria-expanded="false">
                        <th:block th:with="pic=${#authentication.principal.picture},
                                           nm=${#authentication.principal.fullName}">
                            <img th:if="${pic != null and !#strings.isEmpty(pic)}"
                                 th:src="${pic}" class="nav-avatar" th:alt="${nm}"
                                 referrerpolicy="no-referrer">
                            <span th:unless="${pic != null and !#strings.isEmpty(pic)}"
                                  class="nav-avatar-fallback"
                                  th:text="${nm != null and !#strings.isEmpty(nm)}
                                           ? ${#strings.toUpperCase(#strings.substring(nm,0,1))} : 'U'">
                            </span>
                        </th:block>
                        <span class="small text-white" sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="min-width:210px">
                        <li class="px-3 py-2 border-bottom">
                            <div class="small fw-semibold" sec:authentication="principal.fullName"></div>
                            <div class="small text-muted" sec:authentication="principal.email"></div>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/profile}">
                                <i class="bi bi-person me-2 text-primary"></i>Profile
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        class="dropdown-item py-2 text-danger border-0 bg-transparent w-100 text-start">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Flash messages -->
<div class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 rounded-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 rounded-3">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<main class="container">
    <th:block th:replace="${content}"/>
</main>

<footer class="bg-dark text-center py-3">
    <small class="text-warning">
        <i class="bi bi-exclamation-triangle me-1"></i>
        Thông tin mang tính tham khảo kỹ thuật, KHÔNG phải lời khuyên đầu tư.
    </small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>

<script>
// ── Autocomplete search ────────────────────────────────────────────────────────
(function () {
    const PYTHON     = 'http://localhost:8000';
    const input      = document.getElementById('searchInput');
    const dropdown   = document.getElementById('autocompleteDropdown');
    const form       = document.getElementById('searchForm');

    if (!input || !dropdown) return;

    let debounceTimer = null;
    let activeIndex   = -1;
    let currentItems  = [];

    // Debounce: chờ 250ms sau khi gõ mới gọi API
    input.addEventListener('input', function () {
        const q = this.value.trim();
        clearTimeout(debounceTimer);

        if (q.length === 0) {
            hideDropdown();
            return;
        }

        debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
    });

    // Điều hướng bằng bàn phím
    input.addEventListener('keydown', function (e) {
        if (!isVisible()) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, currentItems.length - 1);
            highlightItem(activeIndex);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, -1);
            highlightItem(activeIndex);
        } else if (e.key === 'Enter') {
            if (activeIndex >= 0 && currentItems[activeIndex]) {
                e.preventDefault();
                selectItem(currentItems[activeIndex]);
            }
        } else if (e.key === 'Escape') {
            hideDropdown();
        }
    });

    // Click ngoài → đóng dropdown
    document.addEventListener('click', function (e) {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
            hideDropdown();
        }
    });

    function fetchSuggestions(q) {
        fetch(`${PYTHON}/stocks/search?q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(data => {
                const results = data.results || [];
                currentItems  = results;
                activeIndex   = -1;
                renderDropdown(results, q);
            })
            .catch(() => hideDropdown());
    }

    function renderDropdown(results, q) {
        if (results.length === 0) {
            dropdown.innerHTML = `<div class="autocomplete-empty">
                <i class="bi bi-search me-1"></i>Không tìm thấy "<strong>${q}</strong>"
            </div>`;
            showDropdown();
            return;
        }

        dropdown.innerHTML = results.map((s, i) => `
            <a class="autocomplete-item" data-index="${i}" href="/stocks/${s.symbol}">
                <span class="autocomplete-symbol">${highlight(s.symbol, q)}</span>
                <span class="autocomplete-name">${highlight(s.name || '', q)}</span>
                <span class="autocomplete-badge">${s.exchange || 'HoSE'}</span>
            </a>
        `).join('');

        // Click vào item
        dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
            item.addEventListener('mousedown', function (e) {
                e.preventDefault();
                const idx = parseInt(this.dataset.index);
                selectItem(currentItems[idx]);
            });
        });

        showDropdown();
    }

    function highlight(text, q) {
        if (!q) return text;
        const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark class="bg-warning bg-opacity-50 px-0">$1</mark>');
    }

    function selectItem(stock) {
        if (!stock) return;
        input.value = stock.symbol;
        hideDropdown();
        window.location.href = '/stocks/' + stock.symbol;
    }

    function highlightItem(index) {
        dropdown.querySelectorAll('.autocomplete-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
    }

    function showDropdown() { dropdown.style.display = 'block'; }
    function hideDropdown()  { dropdown.style.display = 'none'; activeIndex = -1; }
    function isVisible()     { return dropdown.style.display === 'block'; }
})();
</script>

<script th:src="@{/js/favorite.js}"></script>

</body>
</html>
