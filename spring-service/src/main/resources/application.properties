spring.application.name=stock-platform
server.port=${SPRING_SERVER_PORT:8080}

# ── Database (H2 dev) ──────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Python microservice ───────────────────────────────────────────────────────
app.python-service.url=http://localhost:8000
app.watchlist=VNM,VCB,HPG,FPT,MWG,TCB,VIC,ACB
app.scheduler.enabled=true

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
# QUAN TRỌNG: Thay YOUR_CLIENT_ID và YOUR_CLIENT_SECRET bằng credentials từ Google Console
# Không commit file này lên GitHub khi đã điền thật!
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}