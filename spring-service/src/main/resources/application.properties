spring.application.name=stock-platform
server.port=8080

# H2 database (dev)
spring.datasource.url=jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Python microservice URL
app.python-service.url=http://localhost:8000

# Watchlist mặc định (phân cách bằng dấu phẩy)
app.watchlist=VNM,VCB,HPG,FPT,MWG,TCB,VIC,ACB

# Scheduler: cập nhật dữ liệu lúc 18:00 mỗi ngày (sau giờ đóng cửa)
app.scheduler.enabled=true
